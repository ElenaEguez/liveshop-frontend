<div class="categories-page" style="width: 100%;">

  <!-- Header -->
  <div class="categories-page-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
    <h1 style="margin:0; font-size:1.75rem; font-weight:700; color:#111827;">Categorías</h1>
    <button mat-raised-button color="primary" (click)="openForm()"
            style="display:flex; align-items:center; gap:8px; padding:0 20px; height:42px;">
      <mat-icon>add</mat-icon>
      Nueva Categoría
    </button>
  </div>

  <mat-form-field appearance="outline" style="width:100%; max-width:400px; margin-bottom:16px;">
    <mat-label>Buscar por nombre</mat-label>
    <input matInput [formControl]="searchControl" placeholder="Nombre de categoría">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <!-- Tabla -->
  <div class="categories-table-card">
    <p class="table-scroll-hint desktop-only" *ngIf="categories.length">Desliza horizontalmente para ver todas las columnas.</p>
    <div class="responsive-table-wrapper desktop-only">
    <table mat-table [dataSource]="categories" class="categories-table">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef
            style="font-weight:600; color:#374151; padding:16px;">Nombre</th>
        <td mat-cell *matCellDef="let c" style="padding:16px; font-weight:500;">
          <span style="background:#fef2f2; color:#db0000; padding:4px 10px;
                       border-radius:20px; font-size:0.85rem;">
            {{ c.name }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef style="font-weight:600; color:#374151;">Descripción</th>
        <td mat-cell *matCellDef="let c" style="color:#6b7280; font-size:0.875rem;">
          {{ c.description || '—' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef style="font-weight:600; color:#374151;">Acciones</th>
        <td mat-cell *matCellDef="let c">
          <button mat-icon-button (click)="openForm(c)" matTooltip="Editar" style="color:#db0000;">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="delete(c)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns" style="background:#f9fafb;"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"
          style="border-bottom:1px solid #f3f4f6;"></tr>
    </table>
    </div>

    <div class="mobile-card-list mobile-only" *ngIf="categories.length">
      <article class="mobile-data-card" *ngFor="let c of categories">
        <div class="mobile-card-header">
          <span style="background:#fef2f2; color:#db0000; padding:4px 10px; border-radius:20px; font-size:0.85rem; font-weight:600;">
            {{ c.name }}
          </span>
        </div>
        <p class="mobile-card-subtitle" style="margin:0 0 8px; color:#6b7280; font-size:0.85rem;">
          {{ c.description || 'Sin descripción' }}
        </p>
        <div class="mobile-card-actions">
          <button mat-stroked-button type="button" (click)="openForm(c)">
            <mat-icon>edit</mat-icon> Editar
          </button>
          <button mat-stroked-button type="button" color="warn" (click)="delete(c)">
            <mat-icon>delete</mat-icon> Eliminar
          </button>
        </div>
      </article>
    </div>

    <div *ngIf="!loading && categories.length === 0" class="empty-state">
      <mat-icon>category</mat-icon>
      <p>No hay categorías aún</p>
      <button mat-raised-button color="primary" (click)="openForm()">
        Crear primera categoría
      </button>
    </div>

    <mat-paginator
      [length]="totalCount"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      [pageSizeOptions]="[10, 25, 50]"
      (page)="onPage($event)">
    </mat-paginator>
  </div>

</div>
