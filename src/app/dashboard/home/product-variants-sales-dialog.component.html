<h2 mat-dialog-title class="pvs-title">
  <mat-icon class="pvs-title-icon">shopping_bag</mat-icon>
  Ventas por variante — {{ data.productName }}
</h2>

<mat-dialog-content class="pvs-content">
  <p class="pvs-period" *ngIf="data.periodLabel">{{ data.periodLabel }}</p>

  <table mat-table [dataSource]="data.variantes" class="pvs-table" *ngIf="data.variantes.length">
    <ng-container matColumnDef="variante">
      <th mat-header-cell *matHeaderCellDef>Variante</th>
      <td mat-cell *matCellDef="let v">{{ v.variante }}</td>
    </ng-container>

    <ng-container matColumnDef="units_sold">
      <th mat-header-cell *matHeaderCellDef class="col-num">Unidades</th>
      <td mat-cell *matCellDef="let v" class="col-num">{{ v.units_sold }}</td>
    </ng-container>

    <ng-container matColumnDef="revenue">
      <th mat-header-cell *matHeaderCellDef class="col-num">Ingresos (Bs.)</th>
      <td mat-cell *matCellDef="let v" class="col-num">{{ (v.revenue || '0') | number:'1.2-2' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <p class="pvs-empty" *ngIf="!data.variantes.length">
    No hay desglose por variante para este producto en el período seleccionado.
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close()">Cerrar</button>
</mat-dialog-actions>
