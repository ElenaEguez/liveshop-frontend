<div class="form-container">
  <div class="form-header">
    <button mat-icon-button type="button" (click)="onVolver()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h2>Nuevo conteo físico</h2>
  </div>

  <mat-card>
    <mat-card-content [formGroup]="form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Almacén</mat-label>
        <mat-select formControlName="almacen">
          <mat-option *ngFor="let a of almacenes"
                      [value]="a.id">
            {{ a.nombre }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Fecha del conteo</mat-label>
        <input matInput type="date" formControlName="fecha">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Notas</mat-label>
        <textarea matInput rows="2" formControlName="notas"></textarea>
      </mat-form-field>
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-button type="button" (click)="onVolver()">Cancelar</button>
      <button mat-raised-button color="primary"
              type="button"
              (click)="onGuardar()"
              [disabled]="guardando || form.invalid">
        Crear conteo
      </button>
    </mat-card-actions>
  </mat-card>
</div>
