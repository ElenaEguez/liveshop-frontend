<div class="orden-list">
  <div class="header">
    <h2>Órdenes de compra</h2>
    <div class="actions">
      <button mat-stroked-button color="warn" routerLink="/compras/devolucion-proveedor">
        <mat-icon>undo</mat-icon>
        Devolución a proveedor
      </button>
      <button mat-raised-button color="primary" (click)="irNueva()">
        <mat-icon>add</mat-icon>
        Nueva orden
      </button>
    </div>
  </div>

  <mat-card>
    <mat-card-content>
      <table class="table" *ngIf="ordenes.length > 0">
        <thead>
          <tr>
            <th>Número</th>
            <th>Proveedor</th>
            <th>Fecha</th>
            <th>Estado</th>
            <th>Total</th>
            <th class="th-acciones">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let o of ordenes">
            <td>
              <a [routerLink]="['/compras', o.id]" class="link-num">{{ o.numero }}</a>
            </td>
            <td>{{ o.proveedor_data?.nombre || '—' }}</td>
            <td>{{ o.fecha }}</td>
            <td>{{ o.estado }}</td>
            <td>Bs. {{ o.total || 0 | number:'1.2-2' }}</td>
            <td class="cell-actions">
              <span class="row-actions">
                <a *ngIf="o.id"
                   mat-icon-button
                   color="primary"
                   [routerLink]="['/compras', o.id]"
                   matTooltip="Ver detalle">
                  <mat-icon>visibility</mat-icon>
                </a>
                <a *ngIf="o.id && puedeEditar(o)"
                   mat-icon-button
                   color="accent"
                   [routerLink]="['/compras', o.id, 'edit']"
                   matTooltip="Editar orden">
                  <mat-icon>edit</mat-icon>
                </a>
                <a
                  *ngIf="o.estado === 'recibida' && o.id"
                  mat-stroked-button
                  color="warn"
                  class="btn-mini"
                  [routerLink]="['/compras/devolucion-proveedor']"
                  [queryParams]="{ orden: o.id }"
                  (click)="$event.stopPropagation()"
                >
                  Devolver
                </a>
              </span>
            </td>
          </tr>
        </tbody>
      </table>
      <p *ngIf="!cargando && ordenes.length === 0">Sin órdenes registradas.</p>
    </mat-card-content>
  </mat-card>
</div>
