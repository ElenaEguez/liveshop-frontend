<div class="proveedores-container">

  <div class="header-actions">
    <h2>Proveedores</h2>
    <button mat-raised-button color="primary" (click)="onNuevo()">
      <mat-icon>add</mat-icon> Nuevo proveedor
    </button>
  </div>

  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Buscar por nombre</mat-label>
    <input matInput [formControl]="searchControl" placeholder="Nombre del proveedor">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <mat-card *ngFor="let p of proveedores" class="proveedor-card">
    <mat-card-content>
      <div class="proveedor-row">
        <div class="proveedor-info">
          <div>
            <strong>{{ p.nombre }}</strong>
            <mat-chip-list *ngIf="!p.activo">
              <mat-chip color="warn" selected class="chip-inactivo">Inactivo</mat-chip>
            </mat-chip-list>
          </div>
          <div class="proveedor-datos">
            <span *ngIf="p.contacto"><mat-icon>person</mat-icon> {{ p.contacto }}</span>
            <span *ngIf="p.telefono"><mat-icon>phone</mat-icon> {{ p.telefono }}</span>
            <span *ngIf="p.email"><mat-icon>email</mat-icon> {{ p.email }}</span>
          </div>
          <p *ngIf="p.notas" class="notas">{{ p.notas }}</p>
        </div>
        <div class="proveedor-acciones">
          <button mat-icon-button type="button" (click)="onEditar(p)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" color="warn" (click)="onEliminar(p)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
          <button mat-icon-button type="button" (click)="onToggleActivo(p)"
                  [matTooltip]="p.activo ? 'Desactivar' : 'Activar'">
            <mat-icon>{{ p.activo ? 'toggle_on' : 'toggle_off' }}</mat-icon>
          </button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

  <p *ngIf="!loading && proveedores.length === 0" class="empty-state">
    No hay proveedores registrados.
  </p>

  <mat-paginator
    [length]="totalCount"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="[10, 20, 50]"
    (page)="onPage($event)">
  </mat-paginator>

</div>
